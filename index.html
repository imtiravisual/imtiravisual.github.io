<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Imtira Visual — Talking-head reels with a luxury finish</title>
<meta name="description" content="Talking-head reels with a luxury finish for creators and founders who want to look as sharp as their ideas.">
<meta name="theme-color" content="#0F1F1E">
<meta property="og:title" content="Imtira Visual">
<meta property="og:description" content="Every Frame Has a Purpose. Talking-head reels with a luxury finish.">
<meta property="og:image" content="https://imtiravisual.github.io/og.png">
<meta property="og:type" content="website">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<script>document.documentElement.classList.add('js')</script>
</head>
<body>

<header class="nav" id="nav">
  <a class="brand" href="#top" aria-label="Imtira Visual">
    <img src="mark.png" alt="" width="30" height="30"><span>IMTIRA <b>VISUAL</b></span>
  </a>
  <nav class="links" aria-label="Main">
    <a href="#work" data-i18n="nav.work"></a>
    <a href="#before-after" data-i18n="nav.ba"></a>
    <a href="#service" data-i18n="nav.services"></a>
    <a href="#about" data-i18n="nav.about"></a>
    <a href="#contact" data-i18n="nav.contact"></a>
  </nav>
  <div class="nav-right">
    <a class="btn btn-sm wa-link" href="#" data-i18n="nav.cta" target="_blank" rel="noopener"></a>
  </div>
</header>

<main id="top">
  <!-- HERO -->
  <section class="hero">
    <div class="glow" aria-hidden="true"></div>
    <div class="wrap hero-grid">
      <div class="hero-copy">
        <p class="eyebrow"><span class="dot"></span><span data-i18n="hero.eyebrow"></span></p>
        <h1 data-i18n-html="hero.title"></h1>
        <p class="lead" data-i18n="hero.sub"></p>
        <div class="cta">
          <a class="btn" href="#work" data-i18n="hero.btn1"></a>
          <a class="btn btn-ghost wa-link" href="#" target="_blank" rel="noopener" data-i18n="hero.btn2"></a>
        </div>
        <div class="crafted">
          <span data-i18n="crafted"></span>
          <ul><li>Adobe Premiere Pro</li><li>Adobe After Effects</li></ul>
        </div>
      </div>
      <div class="phones" id="heroPhones"></div>
    </div>
  </section>

  <!-- WORK -->
  <section class="section" id="work">
    <div class="wrap">
      <header class="head reveal"><p class="kicker" data-i18n="work.kicker"></p><h2 data-i18n="work.title"></h2><p class="sub" data-i18n="work.sub"></p></header>
      <div class="reels" id="reels"></div>
      <div class="reels wide-grid" id="reelsWide"></div>
    </div>
  </section>

  <!-- BEFORE / AFTER -->
  <section class="section alt" id="before-after">
    <div class="wrap">
      <header class="head reveal"><p class="kicker" data-i18n="ba.kicker"></p><h2 data-i18n="ba.title"></h2><p class="sub" data-i18n="ba.sub"></p></header>
      <div class="ba-grid" id="baGrid"></div>
    </div>
  </section>

  <!-- SERVICE -->
  <section class="section" id="service">
    <div class="wrap">
      <header class="head reveal"><p class="kicker" data-i18n="sv.kicker"></p><h2 data-i18n="sv.title"></h2></header>
      <article class="service reveal">
        <h3 data-i18n="sv.card"></h3>
        <p data-i18n="sv.desc"></p>
        <ul>
          <li data-i18n="sv.b1"></li><li data-i18n="sv.b2"></li><li data-i18n="sv.b3"></li><li data-i18n="sv.b4"></li>
        </ul>
        <p class="note" data-i18n="sv.note"></p>
        <a class="btn wa-link" href="#" target="_blank" rel="noopener" data-i18n="sv.btn"></a>
      </article>
    </div>
  </section>

  <!-- PROCESS -->
  <section class="section alt" id="process">
    <div class="wrap">
      <header class="head reveal"><p class="kicker" data-i18n="pr.kicker"></p><h2 data-i18n="pr.title"></h2></header>
      <ol class="steps">
        <li class="reveal"><span>01</span><h3 data-i18n="pr.1t"></h3><p data-i18n="pr.1d"></p></li>
        <li class="reveal"><span>02</span><h3 data-i18n="pr.2t"></h3><p data-i18n="pr.2d"></p></li>
        <li class="reveal"><span>03</span><h3 data-i18n="pr.3t"></h3><p data-i18n="pr.3d"></p></li>
        <li class="reveal"><span>04</span><h3 data-i18n="pr.4t"></h3><p data-i18n="pr.4d"></p></li>
      </ol>
    </div>
  </section>

  <!-- ABOUT -->
  <section class="section" id="about">
    <div class="wrap about">
      <figure class="about-photo reveal"><img src="about.jpg" alt="Md Imteaj Uddin" loading="lazy"></figure>
      <div class="reveal">
        <p class="kicker" data-i18n="ab.kicker"></p>
        <h2 data-i18n="ab.title"></h2>
        <p class="who" data-i18n="ab.name"></p>
        <p class="lead" data-i18n="ab.text"></p>
        <ul class="benefits">
          <li><h3 data-i18n="ab.b1t"></h3><p data-i18n="ab.b1d"></p></li>
          <li><h3 data-i18n="ab.b2t"></h3><p data-i18n="ab.b2d"></p></li>
          <li><h3 data-i18n="ab.b3t"></h3><p data-i18n="ab.b3d"></p></li>
          <li><h3 data-i18n="ab.b4t"></h3><p data-i18n="ab.b4d"></p></li>
        </ul>
        <a class="btn wa-link" href="#" target="_blank" rel="noopener" data-i18n="ab.btn"></a>
      </div>
    </div>
  </section>

  <!-- TESTIMONIALS (hidden until you add some in js/content.js) -->
  <section class="section alt" id="testimonials" hidden>
    <div class="wrap">
      <header class="head reveal"><p class="kicker" data-i18n="ts.kicker"></p><h2 data-i18n="ts.title"></h2></header>
      <div class="quotes" id="quotes"></div>
      <p class="ts-note" data-i18n="ts.note"></p>
    </div>
    <div class="shots" id="shots" aria-label="Client messages">
    </div>
  </section>

  <!-- TRUSTED BY (second-last section) -->
  <section class="trusted" id="trusted" aria-label="Trusted by">
    <p class="kicker center" data-i18n="tr.title"></p>
    <div class="marquee"><div class="track" id="track"></div></div>
  </section>

  <!-- CONTACT (last section) -->
  <section class="section contact" id="contact">
    <div class="wrap contact-grid">
      <div class="reveal">
        <p class="kicker" data-i18n="ct.kicker"></p>
        <h2 data-i18n="ct.title"></h2>
        <p class="lead" data-i18n="ct.sub"></p>
        <p class="direct-t" data-i18n="ct.direct"></p>
        <ul class="direct">
          <li><a class="wa-link" href="#" target="_blank" rel="noopener">WhatsApp</a></li>
          <li><a class="ig-link" href="#" target="_blank" rel="noopener">Instagram</a></li>
          <li><a class="mail-link" href="#">Email</a></li>
        </ul>
      </div>
      <form class="form reveal" id="form" novalidate>
        <label><span data-i18n="ct.name"></span><input name="name" required autocomplete="name"></label>
        <label><span data-i18n="ct.contact"></span><input name="contact" required autocomplete="email"></label>
        <label><span data-i18n="ct.msg"></span><textarea name="message" rows="5" required></textarea></label>
        <input type="text" name="botcheck" tabindex="-1" autocomplete="off" class="hp" aria-hidden="true">
        <button class="btn" type="submit" data-i18n="ct.send"></button>
        <p class="status" id="status" role="status"></p>
      </form>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="wrap foot">
    <img src="logo.png" alt="Imtira Visual" class="foot-logo" width="140" loading="lazy">
    <div class="foot-links"><a class="ig-link" href="#" target="_blank" rel="noopener">Instagram</a><a class="wa-link" href="#" target="_blank" rel="noopener">WhatsApp</a></div>
    <p class="small"><span data-i18n="ft.rights"></span> · <span data-i18n="ft.privacy"></span></p>
  </div>
</footer>

<dialog id="player" aria-label="Video player">
  <button class="x" id="playerClose" aria-label="Close">×</button>
  <div id="playerBody"></div>
</dialog>

<script src="text.js"></script>
<script src="content.js"></script>
<script src="main.js"></script>
</body>
</html>
